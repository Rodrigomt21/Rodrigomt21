<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF6B00" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="300" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>

    <!-- orange accent bar -->
    <rect x="72" y="88" width="6" height="124" rx="3" fill="#FF6B00"/>

    <!-- name -->
    <text x="104" y="140" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Rodrigo Monteiro</text>

    <!-- tagline -->
    <text x="106" y="184" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Consolas, monospace" font-size="20" fill="#C9D1D9">
      <tspan fill="#FF6B00">&gt;</tspan> ai engineer · agentes generativos · visão computacional
      <tspan fill="#FF6B00">
        <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>_</tspan>
    </text>

    <!-- chips -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
      <rect x="106" y="204" width="118" height="26" rx="13" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.5"/>
      <text x="165" y="221" text-anchor="middle" fill="#FF6B00">LLM · Agents</text>
      <rect x="234" y="204" width="132" height="26" rx="13" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.5"/>
      <text x="300" y="221" text-anchor="middle" fill="#FF6B00">Edge Computing</text>
      <rect x="376" y="204" width="156" height="26" rx="13" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.5"/>
      <text x="454" y="221" text-anchor="middle" fill="#FF6B00">Computer Vision</text>
    </g>

    <!-- right side: abstract node graph (agents) -->
    <g stroke="#FF6B00" stroke-opacity="0.55" stroke-width="1.5" fill="none">
      <line x1="900" y1="150" x2="1000" y2="90"/>
      <line x1="900" y1="150" x2="1010" y2="200"/>
      <line x1="1000" y1="90" x2="1090" y2="120"/>
      <line x1="1010" y1="200" x2="1090" y2="120"/>
      <line x1="1010" y1="200" x2="1060" y2="250"/>
      <line x1="900" y1="150" x2="830" y2="220"/>
    </g>
    <g fill="#0D1117" stroke="#FF6B00" stroke-width="2">
      <circle cx="900" cy="150" r="14"/>
      <circle cx="1000" cy="90" r="9"/>
      <circle cx="1010" cy="200" r="9"/>
      <circle cx="1090" cy="120" r="9"/>
      <circle cx="1060" cy="250" r="6"/>
      <circle cx="830" cy="220" r="6"/>
    </g>
    <circle cx="900" cy="150" r="5" fill="#FF6B00">
      <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
