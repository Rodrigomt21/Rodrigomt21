<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#FF6B00" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FF6B00" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="300" rx="16"/></clipPath>

    <!-- edges do harness (usados também como trilho das partículas) -->
    <path id="e1" d="M865 95 L950 150"/>
    <path id="e2" d="M1035 95 L950 150"/>
    <path id="e3" d="M865 205 L950 150"/>
    <path id="e4" d="M1035 205 L950 150"/>
    <path id="e5" d="M950 150 L1135 150"/>
    <path id="e6" d="M700 150 L820 150"/>
  </defs>

  <g clip-path="url(#round)" font-family="JetBrains Mono, Fira Code, SFMono-Regular, Consolas, monospace">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>

    <!-- constelação de fundo -->
    <g stroke="#FF6B00" stroke-opacity="0.12" stroke-width="1" fill="#FF6B00" fill-opacity="0.35">
      <line x1="60" y1="40" x2="140" y2="70"/><line x1="140" y1="70" x2="200" y2="30"/>
      <line x1="520" y1="250" x2="600" y2="270"/><line x1="600" y1="270" x2="660" y2="230"/>
      <circle cx="60" cy="40" r="2"/><circle cx="140" cy="70" r="2.5"/><circle cx="200" cy="30" r="2"/>
      <circle cx="520" cy="250" r="2"/><circle cx="600" cy="270" r="2.5"/><circle cx="660" cy="230" r="2"/>
    </g>

    <!-- ===== lado esquerdo: identidade ===== -->
    <rect x="72" y="84" width="6" height="132" rx="3" fill="#FF6B00"/>
    <text x="104" y="136" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Rodrigo Monteiro</text>
    <text x="106" y="176" font-size="18" fill="#C9D1D9"><tspan fill="#FF6B00">&gt;</tspan> backend · agentes · harness · visão computacional<tspan fill="#FF6B00"><animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>_</tspan></text>

    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#FF6B00">
      <rect x="106" y="196" width="96" height="24" rx="12" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.5"/>
      <text x="154" y="212" text-anchor="middle">LLM Agents</text>
      <rect x="212" y="196" width="74" height="24" rx="12" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.5"/>
      <text x="249" y="212" text-anchor="middle">Harness</text>
      <rect x="296" y="196" width="108" height="24" rx="12" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.5"/>
      <text x="350" y="212" text-anchor="middle">Agent Graphs</text>
      <rect x="414" y="196" width="80" height="24" rx="12" fill="#FF6B00" fill-opacity="0.12" stroke="#FF6B00" stroke-opacity="0.5"/>
      <text x="454" y="212" text-anchor="middle">Edge CV</text>
    </g>

    <!-- ===== lado direito: harness de agente ===== -->

    <!-- grafo de agentes (entrada) -->
    <g stroke="#FF6B00" stroke-opacity="0.5" stroke-width="1.5" fill="none">
      <line x1="660" y1="95" x2="700" y2="150"/>
      <line x1="660" y1="205" x2="700" y2="150"/>
      <line x1="660" y1="95" x2="660" y2="205"/>
      <use href="#e6" stroke-dasharray="4 4"/>
    </g>
    <g fill="#0D1117" stroke="#FF6B00" stroke-width="2">
      <circle cx="660" cy="95" r="8"/>
      <circle cx="660" cy="205" r="8"/>
      <circle cx="700" cy="150" r="10"/>
    </g>
    <text x="640" y="245" font-size="11" fill="#8B949E">agent graph</text>

    <!-- caixa do harness -->
    <rect x="820" y="55" width="250" height="190" rx="14" fill="#FF6B00" fill-opacity="0.04" stroke="#FF6B00" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="836" y="48" font-size="12" font-weight="700" fill="#FF6B00" letter-spacing="2">HARNESS</text>

    <!-- edges internas -->
    <g stroke="#FF6B00" stroke-opacity="0.45" stroke-width="1.5" fill="none">
      <use href="#e1"/><use href="#e2"/><use href="#e3"/><use href="#e4"/>
    </g>
    <use href="#e5" stroke="#FF6B00" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>

    <!-- nó central: modelo -->
    <circle cx="950" cy="150" r="30" fill="#0D1117" stroke="#FF6B00" stroke-width="2.5"/>
    <circle cx="950" cy="150" r="30" fill="none" stroke="#FF6B00" stroke-opacity="0.35" stroke-width="2">
      <animate attributeName="r" values="30;40;30" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.35;0;0.35" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="950" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">LLM</text>

    <!-- satélites -->
    <g fill="#0D1117" stroke="#FF6B00" stroke-width="2">
      <rect x="839" y="80" width="52" height="30" rx="7"/>
      <rect x="1009" y="80" width="52" height="30" rx="7"/>
      <rect x="839" y="190" width="52" height="30" rx="7"/>
      <rect x="1009" y="190" width="52" height="30" rx="7"/>
    </g>
    <g font-size="10.5" font-weight="600" fill="#C9D1D9" text-anchor="middle">
      <text x="865" y="99">tools</text>
      <text x="1035" y="99">memory</text>
      <text x="865" y="209">guards</text>
      <text x="1035" y="209">evals</text>
    </g>

    <!-- saída -->
    <rect x="1130" y="130" width="40" height="40" rx="8" fill="#0D1117" stroke="#FF6B00" stroke-width="2"/>
    <path d="M1141 150 h14 m-5 -5 l5 5 l-5 5" stroke="#FF6B00" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1150" y="190" font-size="11" fill="#8B949E" text-anchor="middle">output</text>

    <!-- partículas em movimento (fluxo de dados) -->
    <g fill="#FF6B00">
      <circle r="3"><animateMotion dur="1.8s" repeatCount="indefinite" begin="0s"><mpath href="#e1"/></animateMotion></circle>
      <circle r="3"><animateMotion dur="1.8s" repeatCount="indefinite" begin="0.45s"><mpath href="#e2"/></animateMotion></circle>
      <circle r="3"><animateMotion dur="1.8s" repeatCount="indefinite" begin="0.9s"><mpath href="#e3"/></animateMotion></circle>
      <circle r="3"><animateMotion dur="1.8s" repeatCount="indefinite" begin="1.35s"><mpath href="#e4"/></animateMotion></circle>
      <circle r="3"><animateMotion dur="2.2s" repeatCount="indefinite" begin="0.3s"><mpath href="#e6"/></animateMotion></circle>
      <circle r="3.5"><animateMotion dur="2.2s" repeatCount="indefinite" begin="1.1s"><mpath href="#e5"/></animateMotion></circle>
    </g>
  </g>
</svg>
